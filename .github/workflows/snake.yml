name: Generate pastel contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: maryem1008
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23C16D96&color_dots=%23F8E8F0%2C%23F1D4E3%2C%23E8B5CF%2C%23D98FB5%2C%23B96C95

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
